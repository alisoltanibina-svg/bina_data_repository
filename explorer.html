<!DOCTYPE html>
<!--
  File: explorer.html
  Purpose: Explorer landing (topic catalog) and indicator desk.
  Notes: Visible UI strings remain in Persian.
-->

<html lang="fa" dir="rtl" class="treat-v1">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>کاوشگر داده - سامانه تصمیم‌ یار فرهنگی و اجتماعی</title>
    <link rel="stylesheet" href="assets/fonts/peyda.css">
    <script src="force-motion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="global.css?v=banner1">
    <link rel="stylesheet" href="explorer.css?v=ex3">
    <link rel="stylesheet" href="treat-v1.css?v=7">
    <script src="config.js"></script>
    <script src="explorer.js"></script>
    <script src="auth.js" defer></script>
</head>
<body class="explorer-body">

    <script>
        window.explorerSource = new URLSearchParams(window.location.search).get('source') || 'atlas';
    </script>

    <div id="top-banner" data-page="explorer"></div>
    <script src="banner.js"></script>
    <header id="main-header" hidden></header>

    <div class="explorer-workspace">

        <div id="view-landing" class="ex-landing">
            <script>
                if (new URLSearchParams(window.location.search).has('indicator')) {
                    document.getElementById('view-landing').style.display = 'none';
                }
            </script>
            <div class="ex-atmosphere" aria-hidden="true"></div>
            <div class="ex-stage" id="mosaic-menu"></div>
        </div>

        <div id="view-dashboard" class="ex-dash hidden">
            <div class="ex-dash-head">
                <button type="button" id="btn-nav-subtopics" onclick="goBackToLanding()">
                    <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                    بازگشت به حوزه‌ها
                </button>
                <p class="ex-kicker" id="dash-topic-kicker"></p>
                <h2 id="indicator-title">نام شاخص</h2>
                <p id="insight-text">در حال بارگذاری اطلاعات...</p>
                <div class="ex-meta">
                    <span id="indicator-source">منبع: نامشخص</span>
                    <span id="indicator-period">دوره: نامشخص</span>
                </div>
            </div>

            <div class="ex-dash-body">
                <section class="ex-chart-room">
                    <div class="chart-toolbar">
                        <h3 id="chart-panel-title">روند تغییرات زمانی شاخص</h3>
                        <div class="chart-switcher" role="tablist" aria-label="نوع نمودار">
                            <button type="button" class="chart-mode-btn active" id="btn-chart-trend" onclick="setChartMode('trend')">نمودار روندی</button>
                            <button type="button" class="chart-mode-btn" id="btn-chart-compare" onclick="setChartMode('compare')">نمودار مقایسه‌ای</button>
                        </div>
                    </div>
                    <div id="canvas-reveal-wrapper">
                        <div id="trend-chart-wrap" class="chart-pane is-active">
                            <canvas id="mainChart"></canvas>
                        </div>
                        <div id="compare-chart-wrap" class="chart-pane">
                            <canvas id="scatterProvinceChart"></canvas>
                        </div>
                    </div>
                </section>

                <aside class="ex-prov-rail" aria-label="مقایسه استانی">
                    <h2>مقایسه استانی</h2>
                    <div class="ex-prov-search">
                        <input type="text" id="province-search" onkeyup="filterProvinces()" placeholder="جستجوی استان..." autocomplete="off">
                    </div>
                    <div class="ex-prov-actions">
                        <button type="button" onclick="selectAllProvinces()">انتخاب همه</button>
                        <button type="button" onclick="clearAllProvinces()">پاک کردن همه</button>
                    </div>
                    <div class="ex-prov-list custom-scrollbar" id="provinces-list"></div>
                </aside>
            </div>
        </div>
    </div>
</body>
</html>
