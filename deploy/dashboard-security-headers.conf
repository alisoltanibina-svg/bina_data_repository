# Install as /etc/nginx/snippets/dashboard-security-headers.conf.
# Include in HTTPS locations serving HTML/assets directly. A location with its
# own add_header directives does not inherit the parent server's headers.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
# Compatible with the existing inline scripts and mapping SDK. This policy
# restricts framing, object embedding and form/base targets, not script sources.
add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
