# Put this location BEFORE `location /`.
# 301/302 on /api/* turns browser POST into GET and drops the body (login/register break).
# Terminate TLS on 443 and proxy HTTP to uvicorn. If HTTP must redirect to HTTPS, use 308:
#   location /api/ { return 308 https://$host$request_uri; }
# Do not rewrite /api/* with `permanent` or `return 301`.

location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin $http_origin;
    proxy_set_header Content-Type $http_content_type;
    proxy_redirect off;
}
