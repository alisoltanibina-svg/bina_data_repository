<!DOCTYPE html>
<!--
  File: register.html
  Purpose: Public membership request form. Admin later accepts or rejects the request.
  Notes: Visible UI strings remain in Persian. Submits to POST /api/auth/register.
-->

<html lang="fa" dir="rtl" class="treat-v1">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>درخواست عضویت — دیده‌بان فرهنگ</title>
    <link rel="icon" href="../assets/images/Logo.webp" type="image/webp">
    <link rel="stylesheet" href="../assets/fonts/peyda.css">
    <script src="../js/force-motion.js"></script>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/register.css">
    <link rel="stylesheet" href="../css/treat-v1.css">
    <script src="../js/config.js"></script>
    <script src="../js/shared.js"></script>
    <script src="../js/register.js" defer></script>
    <script src="../js/auth.js" defer></script>
</head>
<body class="register-body">

    <div id="top-banner" data-page="register"></div>
    <script src="../js/banner.js"></script>

    <main class="register-workspace">
        <section class="register-card" id="register-card">
            <p class="register-kicker">عضویت</p>
            <h1>درخواست عضویت</h1>
            <p class="register-lead">پس از ارسال، درخواست شما بررسی می‌شود. پس از پذیرش می‌توانید وارد بخش‌های نیازمند عضویت شوید.</p>

            <form id="register-form" novalidate>
                <div class="register-pair">
                    <label class="register-field">
                        <span>نام</span>
                        <input type="text" id="first_name" name="first_name" autocomplete="given-name" required maxlength="40">
                        <em class="register-error" id="err-first_name" hidden></em>
                    </label>
                    <label class="register-field">
                        <span>نام خانوادگی</span>
                        <input type="text" id="last_name" name="last_name" autocomplete="family-name" required maxlength="40">
                        <em class="register-error" id="err-last_name" hidden></em>
                    </label>
                </div>

                <label class="register-field">
                    <span>شماره موبایل</span>
                    <input type="tel" id="phone" name="phone" inputmode="tel" dir="ltr" autocomplete="tel" required maxlength="16" placeholder="09121234567">
                    <em class="register-error" id="err-phone" hidden></em>
                </label>

                <label class="register-field">
                    <span>سمت</span>
                    <input type="text" id="role_title" name="role_title" autocomplete="organization-title" required maxlength="60" placeholder="پژوهشگر">
                    <em class="register-error" id="err-role_title" hidden></em>
                </label>

                <label class="register-field">
                    <span>سازمان <small>اختیاری</small></span>
                    <input type="text" id="organization" name="organization" autocomplete="organization" maxlength="80">
                </label>

                <div class="register-pair">
                    <label class="register-field">
                        <span>رمز عبور</span>
                        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
                        <em class="register-error" id="err-password" hidden></em>
                    </label>
                    <label class="register-field">
                        <span>تکرار رمز عبور</span>
                        <input type="password" id="password_confirm" name="password_confirm" autocomplete="new-password" required minlength="8">
                        <em class="register-error" id="err-password_confirm" hidden></em>
                    </label>
                </div>

                <p class="register-hint">رمز حداقل ۸ نویسه باشد. تا زمان پذیرش، حسابی ساخته نمی‌شود.</p>

                <button type="submit" class="register-submit" id="register-submit">ارسال درخواست</button>
            </form>
        </section>

        <section class="register-card register-done" id="register-done" hidden>
            <p class="register-kicker">درخواست ثبت شد</p>
            <h1>در انتظار بررسی</h1>
            <p class="register-lead" id="register-done-text">درخواست شما دریافت شد. پس از پذیرش مدیر، می‌توانید وارد شوید.</p>
            <a class="register-submit register-link" href="../index.html">بازگشت به صفحه اصلی</a>
        </section>
    </main>

</body>
</html>
