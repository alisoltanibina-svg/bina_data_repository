<!DOCTYPE html>
<!--
  File: explorer.html
  Purpose: Explorer landing (topic catalog) and indicator desk.
  Notes: Visible UI strings remain in Persian.
-->

<html lang="fa" dir="rtl" class="treat-v1 auth-pending">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content">
    <title>کاوشگر — دیده‌بان فرهنگ</title>
    <link rel="icon" href="../assets/images/Logo_tab.webp" type="image/webp">
    <link rel="manifest" href="/webmanifest.json">
    <meta name="theme-color" content="#515811">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
    <link rel="stylesheet" href="../assets/fonts/peyda.css">
    <script src="../js/force-motion.js"></script>
    <script src="../assets/vendor/chart.js/chart.umd.min.js" defer></script>
    <script src="../assets/vendor/chartjs-plugin-datalabels/chartjs-plugin-datalabels.min.js" defer></script>
    <script src="../assets/vendor/gsap/gsap.min.js" defer></script>
    <script src="../assets/vendor/gsap/ScrollTrigger.min.js" defer></script>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/explorer.css">
    <link rel="stylesheet" href="../css/treat-v1.css">
    <script src="../js/config.js"></script>
    <script src="../js/shared.js"></script>
    <script src="../js/explorer.js" defer></script>
    <script src="../js/auth.js" defer></script>
</head>
<body class="explorer-body">

    <script>
        window.explorerSource = new URLSearchParams(window.location.search).get('source') || 'atlas';
    </script>

    <div id="top-banner" data-page="explorer"></div>
    <script src="../js/banner.js"></script>
    <header id="main-header" hidden></header>
    <nav id="explorer-page-nav" class="page-nav" hidden aria-label="ناوبری اصلی"></nav>

    <div class="explorer-workspace">

        <div id="view-landing" class="ex-landing">
            <script>
                if (new URLSearchParams(window.location.search).has('indicator')) {
                    document.getElementById('view-landing').style.display = 'none';
                }
            </script>
            <div class="ex-stage" id="mosaic-menu"></div>
        </div>

        <div id="view-dashboard" class="ex-dash hidden">
            <div class="ex-dash-head">
                <div class="ex-dash-nav">
                    <button type="button" id="btn-nav-subtopics" aria-label="بازگشت به حوزه‌ها">
                        <span class="ex-back-label">بازگشت به حوزه‌ها</span>
                        <svg class="ex-back-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
                    </button>
                    <div class="ex-dd-group" id="ex-dd-group">
                        <div class="ex-dd" data-dd="topic">
                            <button type="button" class="ex-dd-toggle" id="dd-topic-btn" aria-expanded="false">
                                <span class="ex-dd-kicker">حوزه</span>
                                <span class="ex-dd-value" id="dd-topic-value">—</span>
                                <svg class="ex-dd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                            </button>
                            <div class="ex-dd-menu" id="dd-topic-menu" hidden></div>
                        </div>
                        <div class="ex-dd" data-dd="subtopic">
                            <button type="button" class="ex-dd-toggle" id="dd-subtopic-btn" aria-expanded="false">
                                <span class="ex-dd-kicker">موضوع</span>
                                <span class="ex-dd-value" id="dd-subtopic-value">—</span>
                                <svg class="ex-dd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                            </button>
                            <div class="ex-dd-menu" id="dd-subtopic-menu" hidden></div>
                        </div>
                        <div class="ex-dd" data-dd="indicator">
                            <button type="button" class="ex-dd-toggle" id="dd-indicator-btn" aria-expanded="false">
                                <span class="ex-dd-kicker">شاخص</span>
                                <span class="ex-dd-value" id="dd-indicator-value">—</span>
                                <svg class="ex-dd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                            </button>
                            <div class="ex-dd-menu" id="dd-indicator-menu" hidden></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="ex-dash-body">
                <aside class="ex-side" aria-label="فیلتر استان‌ها">
                    <section class="ex-prov-rail" aria-label="مقایسه استانی">
                        <div class="ex-prov-search">
                            <input type="text" id="province-search" placeholder="جستجوی استان" autocomplete="off">
                        </div>
                        <div class="ex-prov-actions">
                            <button type="button" id="btn-select-all-provinces">انتخاب همه</button>
                            <button type="button" id="btn-clear-all-provinces">پاک کردن همه</button>
                        </div>
                        <div class="ex-prov-list custom-scrollbar" id="provinces-list"></div>
                    </section>
                </aside>
                <section class="ex-chart-room">
                    <div class="chart-toolbar">
                        <h3 id="chart-panel-title">روند تغییرات زمانی شاخص</h3>
                        <div class="chart-switcher" role="tablist" aria-label="نوع نمودار">
                            <button type="button" class="chart-mode-btn active" id="btn-chart-trend" data-mode="trend"><svg class="chart-mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 4v16h16"/><path d="m7 14 4-4 4 2 5-7"/></svg><span class="chart-mode-label-full">نمودار روندی</span><span class="chart-mode-label-short">روندی</span></button>
                            <button type="button" class="chart-mode-btn" id="btn-chart-compare" data-mode="compare"><svg class="chart-mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 20h16"/><rect x="5" y="11" width="3" height="6" rx=".6"/><rect x="10.5" y="5" width="3" height="12" rx=".6"/><rect x="16" y="8" width="3" height="9" rx=".6"/></svg><span class="chart-mode-label-full">نمودار مقایسه‌ای</span><span class="chart-mode-label-short">مقایسه‌ای</span></button>
                            <button type="button" class="chart-mode-btn" id="btn-chart-table" data-mode="table"><svg class="chart-mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M9 9v11M15 9v11"/></svg><span class="chart-mode-label-full">جدول</span><span class="chart-mode-label-short">جدول</span></button>
                            <button type="button" class="chart-mode-btn" id="btn-chart-map" data-mode="map"><svg class="chart-mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z"/><path d="M9 3v15M15 6v15"/></svg><span class="chart-mode-label-full">پراکندگی جغرافیایی</span><span class="chart-mode-label-short">پراکندگی</span></button>
                        </div>
                    </div>
                    <div id="canvas-reveal-wrapper">
                        <div id="trend-chart-wrap" class="chart-pane is-active">
                            <canvas id="mainChart"></canvas>
                        </div>
                        <div id="compare-chart-wrap" class="chart-pane">
                            <div class="explorer-compare-canvas"><canvas id="scatterProvinceChart"></canvas></div>
                            <div class="explorer-compare-controls">
                                <label class="explorer-map-timeline" for="explorer-compare-timeline">
                                    <span class="explorer-map-timeline-track">
                                        <input id="explorer-compare-timeline" type="range" min="0" max="0" step="1" value="0" aria-label="انتخاب سال مقایسه استان‌ها">
                                        <span id="explorer-compare-timeline-value">—</span>
                                    </span>
                                </label>
                            </div>
                        </div>
                        <div id="table-chart-wrap" class="chart-pane">
                            <div class="indicator-table-scroll" tabindex="0" aria-label="جدول امتیاز استان‌ها بر اساس سال">
                                <table class="indicator-score-table" id="indicator-score-table">
                                    <caption>جدول امتیاز استان‌ها بر اساس سال</caption>
                                    <thead></thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                        </div>
                        <div id="map-chart-wrap" class="chart-pane" aria-live="polite">
                            <div class="explorer-map-status" id="explorer-map-status">در حال آماده‌سازی نقشه...</div>
                            <div id="explorer-leaflet-map" class="is-loading" aria-label="نقشه ایران" aria-busy="true" inert></div>
                            <div class="explorer-map-controls">
                                <label class="explorer-map-timeline" for="explorer-map-timeline"><span class="explorer-map-timeline-track"><input id="explorer-map-timeline" type="range" min="0" max="0" step="1" value="0" aria-label="انتخاب سال"><span id="explorer-map-timeline-value">—</span></span></label><button type="button" class="explorer-map-play" id="btn-explorer-map-play" aria-pressed="false" aria-label="پخش سال‌ها"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 3 14 9-14 9z"/></svg><span>پخش سال‌ها</span></button>
                                <div class="explorer-map-legend" id="explorer-map-legend" aria-label="راهنمای امتیاز"><span class="explorer-map-legend-title">امتیاز همه سال‌ها</span><span class="explorer-map-legend-no-data"><span class="explorer-map-legend-no-data-swatch" aria-hidden="true"></span><span>بدون داده</span></span><span class="explorer-map-legend-scale"><span class="explorer-map-legend-bar" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></span><span class="explorer-map-legend-range"><b id="explorer-map-legend-min">—</b><b id="explorer-map-legend-max">—</b></span></span></div>
                            </div>
                        </div>
                    </div>
                    <div class="ex-chart-foot">
                        <button type="button" class="ex-insight-open" id="btn-open-insight" aria-haspopup="dialog" aria-controls="insight-layer">
                            <span class="ex-insight-label">توضیحات شاخص</span>
                            <span class="ex-insight-shine" aria-hidden="true"></span>
                        </button>
                        <button type="button" class="ex-chart-legend-btn" id="btn-country-legend">
                            <span class="ex-chart-legend-swatch" aria-hidden="true"></span>
                            میانگین کل کشور
                        </button>
                    </div>
                    <div class="ex-insight-layer" id="insight-layer" hidden>
                        <section class="ex-insight-card" role="dialog" aria-modal="true" aria-labelledby="indicator-title" aria-describedby="insight-text">
                            <div class="ex-insight-heading">
                                <h2 id="indicator-title">نام شاخص</h2>
                                <p id="indicator-question" hidden></p>
                            </div>
                            <p id="insight-text">در حال بارگذاری اطلاعات...</p>
                            <div class="ex-meta">
                                <span id="indicator-unit">واحد اندازه‌گیری: نامشخص</span>
                                <span id="indicator-source">منبع: نامشخص</span>
                                <span id="indicator-period">دوره: نامشخص</span>
                            </div>
                        </section>
                    </div>
                </section>
            </div>
        </div>
    </div>
</body>
</html>
