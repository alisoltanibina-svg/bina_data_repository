<!DOCTYPE html>
<!--
  File: explorer.html
  Purpose: Explorer landing (topic catalog) and indicator desk.
  Notes: Visible UI strings remain in Persian.
-->

<html lang="fa" dir="rtl" class="treat-v1">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>کاوشگر — دیده‌بان فرهنگ</title>
    <link rel="icon" href="../assets/images/Logo.webp" type="image/webp">
    <link rel="stylesheet" href="../assets/fonts/peyda.css">
    <script src="../js/force-motion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js" integrity="sha384-y49Zu59jZHJL/PLKgZPv3k2WI9c0Yp3pWB76V8OBVCb0QBKS8l4Ff3YslzHVX76Y" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js" integrity="sha384-pEQB1h4Zmn9xhS6jotzltHSIQq6N0Oh3BXkCNOH5LKI81R2NRbb9efarAJYw9gTY" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js" integrity="sha384-TgZ1GoXcDnrw/czNfaiSZSFV1zgIRv8aQOevBA8ppS4SkNONmzYfjARpXsDfdnUE" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/explorer.css">
    <link rel="stylesheet" href="../css/treat-v1.css">
    <script src="../js/config.js?v=20260924b"></script>
    <script src="../js/shared.js?v=20260924b"></script>
    <script src="../js/explorer.js" defer></script>
    <script src="../js/auth.js?v=20260924b" defer></script>
</head>
<body class="explorer-body">

    <script>
        window.explorerSource = new URLSearchParams(window.location.search).get('source') || 'atlas';
    </script>

    <div id="top-banner" data-page="explorer"></div>
    <script src="../js/banner.js"></script>
    <header id="main-header" hidden></header>

    <div class="explorer-workspace">

        <div id="view-landing" class="ex-landing">
            <script>
                if (new URLSearchParams(window.location.search).has('indicator')) {
                    document.getElementById('view-landing').style.display = 'none';
                }
            </script>
            <div class="ex-stage" id="mosaic-menu"></div>
        </div>

        <div id="view-dashboard" class="ex-dash hidden">
            <div class="ex-dash-head">
                <div class="ex-dash-nav">
                    <button type="button" id="btn-nav-subtopics">
                        بازگشت به حوزه‌ها
                        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                    </button>
                    <div class="ex-dd-group" id="ex-dd-group">
                        <div class="ex-dd" data-dd="topic">
                            <button type="button" class="ex-dd-toggle" id="dd-topic-btn" aria-expanded="false">
                                <span class="ex-dd-kicker">حوزه</span>
                                <span class="ex-dd-value" id="dd-topic-value">—</span>
                                <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
                            </button>
                            <div class="ex-dd-menu" id="dd-topic-menu" hidden></div>
                        </div>
                        <div class="ex-dd" data-dd="subtopic">
                            <button type="button" class="ex-dd-toggle" id="dd-subtopic-btn" aria-expanded="false">
                                <span class="ex-dd-kicker">موضوع</span>
                                <span class="ex-dd-value" id="dd-subtopic-value">—</span>
                                <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
                            </button>
                            <div class="ex-dd-menu" id="dd-subtopic-menu" hidden></div>
                        </div>
                        <div class="ex-dd" data-dd="indicator">
                            <button type="button" class="ex-dd-toggle" id="dd-indicator-btn" aria-expanded="false">
                                <span class="ex-dd-kicker">شاخص</span>
                                <span class="ex-dd-value" id="dd-indicator-value">—</span>
                                <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
                            </button>
                            <div class="ex-dd-menu" id="dd-indicator-menu" hidden></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="ex-dash-body">
                <section class="ex-chart-room">
                    <div class="chart-toolbar">
                        <h3 id="chart-panel-title">روند تغییرات زمانی شاخص</h3>
                        <div class="chart-switcher" role="tablist" aria-label="نوع نمودار">
                            <button type="button" class="chart-mode-btn active" id="btn-chart-trend" data-mode="trend">نمودار روندی</button>
                            <button type="button" class="chart-mode-btn" id="btn-chart-compare" data-mode="compare">نمودار مقایسه‌ای</button>
                        </div>
                    </div>
                    <div id="canvas-reveal-wrapper">
                        <div id="trend-chart-wrap" class="chart-pane is-active">
                            <canvas id="mainChart"></canvas>
                        </div>
                        <div id="compare-chart-wrap" class="chart-pane">
                            <canvas id="scatterProvinceChart"></canvas>
                        </div>
                    </div>
                </section>

                <aside class="ex-side" aria-label="شرح شاخص و استان‌ها">
                    <section class="ex-insight-card">
                        <h2 id="indicator-title">نام شاخص</h2>
                        <p id="insight-text">در حال بارگذاری اطلاعات...</p>
                        <div class="ex-meta">
                            <span id="indicator-source">منبع: نامشخص</span>
                            <span id="indicator-period">دوره: نامشخص</span>
                        </div>
                    </section>
                    <section class="ex-prov-rail" aria-label="مقایسه استانی">
                        <div class="ex-prov-actions">
                            <button type="button" id="btn-clear-all-provinces">پاک کردن همه</button>
                            <button type="button" id="btn-select-all-provinces">انتخاب همه</button>
                        </div>
                        <div class="ex-prov-search">
                            <input type="text" id="province-search" placeholder="جستجوی استان..." autocomplete="off">
                        </div>
                        <div class="ex-prov-list custom-scrollbar" id="provinces-list"></div>
                    </section>
                </aside>
            </div>
        </div>
    </div>
</body>
</html>
