        grid-template-columns: 1fr;
        justify-items: center;
        gap: 20px;
        width: min(440px, 88vw);
        padding: 28px 0 24vh;
    }

    p { font-size: clamp(17px, 4.5vw, 22px); }

    .maintenance-gear { animation: none; }
}
