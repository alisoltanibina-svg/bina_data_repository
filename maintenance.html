<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>سامانه در حال به‌روزرسانی است</title>
  <style>
    :root { color-scheme: light; font-family: Peyda, Tahoma, Arial, sans-serif; background: #f4f1eb; color: #19352c; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 20% 15%, #dbe9df, transparent 38%), #f4f1eb; }
    main { width: min(100%, 560px); padding: clamp(32px, 8vw, 64px); text-align: center; background: rgba(255,255,255,.86); border: 1px solid #d8e1d8; border-radius: 24px; box-shadow: 0 20px 60px rgba(25,53,44,.12); }
    .mark { width: 52px; height: 52px; margin: 0 auto 24px; border: 5px solid #2f7661; border-top-color: #d8e1d8; border-radius: 50%; animation: turn 1.2s linear infinite; }
    h1 { margin: 0 0 14px; font-size: clamp(1.35rem, 4vw, 1.8rem); }
    p { margin: 0; color: #52675f; line-height: 2; }
    small { display: block; margin-top: 24px; color: #73847d; }
    @keyframes turn { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
  </style>
</head>
<body>
  <main role="status" aria-live="polite">
    <div class="mark" aria-hidden="true"></div>
    <h1>سامانه در حال به‌روزرسانی است</h1>
    <p>برای بهبود کیفیت خدمات، دسترسی به سامانه موقتاً محدود شده است. لطفاً کمی بعد دوباره تلاش کنید.</p>
    <small>از شکیبایی شما سپاسگزاریم.</small>
  </main>
</body>
</html>
