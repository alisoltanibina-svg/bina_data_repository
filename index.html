<!DOCTYPE html>
<!--
  File: index.html
  Purpose: Main dashboard page that contains the interactive map and topic index.
  Notes: Comments in the project have been standardized to English; visible UI strings remain in Persian.
-->

<html lang="fa" dir="rtl" class="treat-v1">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>اطلس — دیده‌بان فرهنگ</title>
    <link rel="icon" href="assets/images/Logo.webp" type="image/webp">
    
    <!-- Leaflet CSS + JS start in the head so the map can init behind the curtain -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous" defer></script>
    <!-- Peyda (Farsi numerals) -->
    <link rel="stylesheet" href="assets/fonts/peyda.css">
    <!-- Page CSS -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/index.css">
    <!-- Reversible revayat treatment. Restore: drop class treat-v1 and this link. -->
    <link rel="stylesheet" href="css/treat-v1.css">
    <!-- Page Javascript -->
    <script src="js/force-motion.js"></script>
    <script src="js/config.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/index.js" defer></script>
    <script src="js/auth.js" defer></script>

    <script>
        const hashAtlas = window.location.hash === '#atlas';
        const curtainEnter = new URLSearchParams(window.location.search).get('curtain') === '1';
        if (hashAtlas || curtainEnter) {
            document.documentElement.classList.add('atlas-view');
        }
        // Restore the accent from the page the user just left (Logo), not the Atlas topic.
        if (!hashAtlas) {
            try {
                const storedAc = sessionStorage.getItem('themeTopicAccent');
                if (storedAc) {
                    document.documentElement.style.setProperty('--topic-accent', storedAc);
                    document.documentElement.style.setProperty('--banner-fg', storedAc);
                }
            } catch (e) {}
        }
    </script>
</head>
<body>

    <!-- Header Banner -->
    <div id="top-banner" data-page="index"></div>
    <script src="js/banner.js"></script>

    <!-- Entry / Welcome Curtain View -->
    <div id="entry-view-curtain" class="entry-curtain">
        <script>
            if (window.location.hash === '#atlas') {
                const curtain = document.getElementById('entry-view-curtain');
                curtain.classList.add('curtain-up');
                curtain.style.transition = 'none'; // Prevent animation on initial load
                setTimeout(() => curtain.style.transition = '', 50);
            }
        </script>
        <div class="entry-scroll">
            <section class="entry-hero" id="entry-hero">
                <div class="entry-hero-stack">
                <div class="entry-launch entry-reveal">
                    <a href="html/login.html" class="entry-login-btn" id="btn-open-login">
                        <span class="entry-login-arrow" aria-hidden="true">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M5 12h14"></path>
                                <path d="M13 6l6 6-6 6"></path>
                            </svg>
                        </span>
                        <span>ورود به حساب کاربری</span>
                    </a>
                    <span class="entry-launch-rule" aria-hidden="true"></span>
                    <a href="html/register.html" class="entry-register-btn" id="btn-open-register">ثبت نام در سامانه</a>
                </div>
                </div>
            </section>
        </div>
        <nav class="entry-dock" id="entry-dock" aria-label="ناوبری صفحه آغاز">
            <span class="entry-dock-item">نمایه</span>
            <a class="entry-dock-item" href="html/explorer.html?source=start">کاوشگر</a>
            <button type="button" class="entry-dock-item is-current" id="btn-dock-atlas">اطلس</button>
            <span class="entry-dock-item">گونه‌شناسی</span>
        </nav>
    </div>

    <!-- Main Dashboard Content -->
    <div id="main-content">
        <div id="atlas-stage">
            <div id="left-popup-panel">
                <h3 id="left-popup-title">شاخص‌ها</h3>
                <p id="left-province-hint" class="instruction">روی یک استان کلیک کنید</p>
                <div id="left-chart-container">
                    <div class="y-tick" style="bottom: 0%;"><span>۰</span></div>
                    <div class="y-tick" style="bottom: 25%;"><span>۲۵</span></div>
                    <div class="y-tick" style="bottom: 50%;"><span>۵۰</span></div>
                    <div class="y-tick" style="bottom: 75%;"><span>۷۵</span></div>
                    <div class="y-tick" style="bottom: 100%;"><span>۱۰۰</span></div>
                    <div id="left-chart-markers"></div>
                </div>
            </div>

            <div id="center-column">
                <div id="map-frame">
                    <div id="map"></div>
                    <div id="map-legend">
                        <span class="legend-title" id="legend-title-text">طیف امتیاز شاخص</span>
                        <div class="legend-scale-wrapper">
                            <div class="legend-scale-bar" id="legend-bar"><div id="score-pointer"><div id="pointer-label">۰</div></div></div>
                            <div class="legend-labels"><span>بد</span><span>متوسط</span><span>خوب</span></div>
                        </div>
                    </div>
                    <div id="map-panel-dock" hidden>
                        <button type="button" class="map-dock-btn is-active" data-sheet="map">نقشه</button>
                        <button type="button" class="map-dock-btn" data-sheet="details">استان</button>
                        <button type="button" class="map-dock-btn" data-sheet="topics">شاخص‌ها</button>
                    </div>
                </div>
            </div>

            <div id="right-panel">
                <div class="right-card right-card-top">
                    <div id="province-details"><p class="instruction">در حال بارگذاری اطلاعات...</p></div>
                </div>
                <div class="right-card right-card-bottom">
                    <p id="province-pick-hint" class="instruction">روی یک استان کلیک کنید</p>
                    <div id="bottom-prov-header" style="width: 100%;"></div>
                    <div id="chart-wrapper" style="width: 100%; height: 150px; margin-bottom: 5px; display: none;"><canvas id="rankingBarChart"></canvas></div>
                    <div id="trend-wrapper" style="width: 100%; height: 150px; margin-bottom: 5px; display: none;"><canvas id="trendChartPanel"></canvas></div>
                </div>
            </div>
        </div>

        <div id="bottom-panel"><ul class="index-list" id="index-list"></ul></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const atlasBtn = document.getElementById('btn-atlas');
            const entryCurtain = document.getElementById('entry-view-curtain');
            const explorerBtn = document.getElementById('btn-explorer');
            const logoImg = document.getElementById('logo-img');

            function isAtlasView() {
                return document.documentElement.classList.contains('atlas-view');
            }

            function setAtlasView(on) {
                document.documentElement.classList.toggle('atlas-view', on);
                if (entryCurtain) entryCurtain.classList.toggle('curtain-up', on);
                if (atlasBtn) atlasBtn.classList.toggle('is-current', on);
                if (on) {
                    updateHeaderButtonsVisibility();
                    if (typeof scheduleMapSync === 'function') {
                        requestAnimationFrame(function () { scheduleMapSync({ animate: false }); });
                        setTimeout(function () { scheduleMapSync({ animate: false }); }, 400);
                        setTimeout(function () { scheduleMapSync({ animate: false }); }, 950);
                    }
                    return;
                }
                const hideAtlasOnlyButtons = () => {
                    if (atlasBtn) atlasBtn.classList.remove('is-current');
                };
                if (!entryCurtain) {
                    hideAtlasOnlyButtons();
                    return;
                }
                let finished = false;
                const finish = (event) => {
                    if (finished) return;
                    if (event && event.target !== entryCurtain) return;
                    if (event && event.propertyName && event.propertyName !== 'transform') return;
                    finished = true;
                    entryCurtain.removeEventListener('transitionend', finish);
                    hideAtlasOnlyButtons();
                };
                entryCurtain.addEventListener('transitionend', finish);
                setTimeout(finish, 1000);
            }

            function setExplorerHrefByState() {
                if (!explorerBtn) return;
                explorerBtn.href = isAtlasView() ? SITE.page("explorer.html?source=atlas") : SITE.page("explorer.html?source=start");
            }

            function updateHeaderButtonsVisibility() {
                const inAtlas = isAtlasView() && window.location.hash === '#atlas';
                if (atlasBtn) atlasBtn.classList.toggle('is-current', inAtlas);
            }

            function consumeCurtainEnter() {
                const params = new URLSearchParams(window.location.search);
                if (params.get('curtain') !== '1') return false;
                params.delete('curtain');
                const query = params.toString();
                const next = window.location.pathname + (query ? '?' + query : '') + window.location.hash;
                history.replaceState("", document.title, next);
                return true;
            }

            const curtainEnter = consumeCurtainEnter() && window.location.hash !== '#atlas';

            if (window.location.hash === '#atlas') {
                setAtlasView(true);
            } else if (curtainEnter) {
                if (entryCurtain) entryCurtain.classList.add('curtain-up');
                if (atlasBtn) atlasBtn.classList.remove('is-current');
            } else {
                updateHeaderButtonsVisibility();
            }

            setExplorerHrefByState();

            if (atlasBtn) {
                atlasBtn.addEventListener('click', (event) => {
                    event.preventDefault();
                    if (window.location.hash !== '#atlas') {
                        history.pushState("", document.title, window.location.pathname + window.location.search + '#atlas');
                    }
                    setAtlasView(true);
                    setExplorerHrefByState();
                    if (typeof topicsData !== 'undefined' && typeof updateTopicColors === 'function' && typeof currentIndex !== 'undefined') {
                        const topicObj = topicsData.find(t => t.topic_name === currentIndex);
                        if (topicObj) updateTopicColors(topicObj);
                    }
                    if (typeof clearSelection === 'function') clearSelection();
                });
            }

            if (logoImg) {
                logoImg.addEventListener('click', () => {
                    setAtlasView(false);
                    setExplorerHrefByState();
                    history.pushState("", document.title, window.location.pathname + window.location.search);
                    if (entryCurtain) {
                        const scroller = entryCurtain.querySelector('.entry-scroll');
                        if (scroller) scroller.scrollTop = 0;
                        entryCurtain.scrollTop = 0;
                    }
                });
            }

            ['btn-dock-atlas'].forEach((id) => {
                const openAtlas = document.getElementById(id);
                if (openAtlas && atlasBtn) {
                    openAtlas.addEventListener('click', (event) => {
                        event.preventDefault();
                        atlasBtn.click();
                    });
                }
            });

            if (curtainEnter) {
                requestAnimationFrame(function () {
                    requestAnimationFrame(function () {
                        setAtlasView(false);
                        setExplorerHrefByState();
                    });
                });
            }

            window.addEventListener('pageshow', function() {
                if (window.location.hash === '#atlas') {
                    updateHeaderButtonsVisibility();
                } else if (atlasBtn) {
                    atlasBtn.classList.remove('is-current');
                }
                setExplorerHrefByState();
            });
        });
    </script>
</body>
</html>
